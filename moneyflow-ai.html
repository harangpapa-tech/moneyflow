<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>머니플로우 AI</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080b12; --surface: #0e1220; --surface2: #151a28; --border: #1c2235;
    --up: #00d48a; --down: #ff3d5a; --foreign: #4da6ff; --inst: #ffb340;
    --ai: #b06aff; --text: #dde3f0; --text2: #6b7594; --text3: #9aa3bf;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--text); font-family:'Noto Sans KR',sans-serif; min-height:100vh; overflow-x:hidden; }

  .topbar { position:sticky; top:0; z-index:200; background:rgba(8,11,18,0.95); backdrop-filter:blur(16px); border-bottom:1px solid var(--border); padding:12px 16px; display:flex; align-items:center; justify-content:space-between; }
  .logo { font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:700; color:var(--foreign); }
  .logo em { color:var(--ai); font-style:normal; }
  .ai-status { display:flex; align-items:center; gap:6px; font-size:10px; color:var(--ai); font-family:'JetBrains Mono',monospace; background:rgba(176,106,255,0.08); border:1px solid rgba(176,106,255,0.2); padding:4px 10px; border-radius:20px; }
  .ai-dot { width:6px; height:6px; background:var(--ai); border-radius:50%; animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  .ticker-wrap { overflow:hidden; background:var(--surface); border-bottom:1px solid var(--border); }
  .ticker { display:flex; overflow-x:auto; scrollbar-width:none; }
  .ticker::-webkit-scrollbar { display:none; }
  .ticker-item { flex:0 0 auto; padding:9px 14px; border-right:1px solid var(--border); }
  .t-label { font-size:9px; color:var(--text2); font-family:'JetBrains Mono',monospace; margin-bottom:2px; }
  .t-val { font-size:13px; font-weight:700; font-family:'JetBrains Mono',monospace; }
  .t-chg { font-size:9px; font-family:'JetBrains Mono',monospace; }
  .up { color:var(--up); } .down { color:var(--down); } .neu { color:var(--text3); }

  .tabs { display:flex; background:var(--surface); border-bottom:1px solid var(--border); overflow-x:auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { flex:1; min-width:65px; padding:10px 4px; text-align:center; font-size:10px; font-weight:500; color:var(--text2); cursor:pointer; border-bottom:2px solid transparent; transition:all 0.2s; white-space:nowrap; }
  .tab.active { color:var(--foreign); border-bottom-color:var(--foreign); background:rgba(77,166,255,0.04); }
  .tab-icon { font-size:14px; display:block; margin-bottom:2px; }

  .page { display:none; padding:12px 12px 90px; }
  .page.active { display:block; }

  .sec-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; margin-top:6px; }
  .sec-title { font-size:11px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:1.2px; font-family:'JetBrains Mono',monospace; }
  .sec-date { font-size:10px; color:var(--text2); font-family:'JetBrains Mono',monospace; }

  /* 수급 흐름 */
  .flow-summary { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:12px; }
  .flow-title { font-size:12px; font-weight:700; color:var(--text2); margin-bottom:10px; font-family:'JetBrains Mono',monospace; }
  .flow-bars { display:flex; flex-direction:column; gap:8px; }
  .flow-row { display:flex; align-items:center; gap:8px; }
  .flow-label { font-size:10px; width:50px; color:var(--text2); flex-shrink:0; }
  .flow-track { flex:1; height:6px; background:var(--surface2); border-radius:3px; overflow:hidden; position:relative; }
  .flow-fill-pos { height:100%; background:var(--up); border-radius:3px; transition:width 0.8s ease; }
  .flow-fill-neg { height:100%; background:var(--down); border-radius:3px; transition:width 0.8s ease; }
  .flow-val { font-family:'JetBrains Mono',monospace; font-size:10px; width:60px; text-align:right; flex-shrink:0; font-weight:700; }

  /* 섹터 히트맵 */
  .sector-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:12px; }
  .sector-cell { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 8px; text-align:center; cursor:pointer; transition:all 0.2s; }
  .sector-cell.hot-up { border-color:rgba(0,212,138,0.4); background:rgba(0,212,138,0.06); }
  .sector-cell.hot-down { border-color:rgba(255,61,90,0.4); background:rgba(255,61,90,0.06); }
  .sector-name { font-size:10px; color:var(--text2); margin-bottom:4px; }
  .sector-pct { font-size:13px; font-weight:700; font-family:'JetBrains Mono',monospace; }

  /* 종목 카드 */
  .stock-group { margin-bottom:16px; }
  .stock-group-title { font-size:10px; color:var(--text2); font-weight:700; letter-spacing:1px; text-transform:uppercase; font-family:'JetBrains Mono',monospace; margin-bottom:8px; padding-left:2px; }
  .stock-list { display:flex; flex-direction:column; gap:6px; }
  .stock-card { background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:11px 13px; display:flex; align-items:center; gap:10px; animation:fadeUp 0.3s ease both; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(5px);} to{opacity:1;transform:translateY(0);} }
  .stock-left { flex:1; min-width:0; }
  .stock-name { font-size:13px; font-weight:700; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .stock-tag { font-size:9px; color:var(--text2); background:var(--surface2); padding:1px 5px; border-radius:3px; display:inline-block; }
  .stock-right { text-align:right; flex-shrink:0; }
  .stock-price { font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:700; margin-bottom:2px; }
  .stock-chg { font-family:'JetBrains Mono',monospace; font-size:11px; }
  .stock-bar { width:60px; height:3px; background:var(--surface2); border-radius:2px; overflow:hidden; margin-top:4px; margin-left:auto; }
  .stock-bar-fill { height:100%; border-radius:2px; }

  /* 토글 */
  .toggle { display:flex; background:var(--surface2); border-radius:10px; padding:3px; gap:2px; margin-bottom:12px; }
  .toggle-btn { flex:1; padding:7px; text-align:center; font-size:11px; font-weight:600; border-radius:8px; cursor:pointer; transition:all 0.2s; color:var(--text2); }
  .toggle-btn.active { background:var(--foreign); color:#fff; }

  /* 수급 탭 */
  .flow-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:13px; margin-bottom:8px; animation:fadeUp 0.3s ease both; }
  .flow-card-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .flow-card-name { font-size:13px; font-weight:700; }
  .flow-card-total { font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; }
  .dual-bar { display:flex; flex-direction:column; gap:5px; }
  .dbar-row { display:flex; align-items:center; gap:7px; }
  .dbar-label { font-size:9px; color:var(--text2); width:26px; font-family:'JetBrains Mono',monospace; }
  .dbar-track { flex:1; height:5px; background:var(--surface2); border-radius:3px; overflow:hidden; }
  .dbar-fill { height:100%; border-radius:3px; }
  .dbar-val { font-family:'JetBrains Mono',monospace; font-size:9px; width:52px; text-align:right; }

  /* 5일 추이 */
  .trend-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:13px; margin-bottom:8px; animation:fadeUp 0.3s ease both; }
  .trend-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:11px; }
  .trend-name { font-size:12px; font-weight:700; }
  .trend-val { font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; }
  .mini-bars { display:flex; align-items:flex-end; gap:5px; height:44px; }
  .mbar-wrap { flex:1; display:flex; flex-direction:column; align-items:center; height:100%; justify-content:flex-end; gap:3px; }
  .mbar { width:100%; border-radius:3px 3px 0 0; min-height:3px; }
  .mday { font-size:8px; color:var(--text2); font-family:'JetBrains Mono',monospace; }

  .disclaimer { margin:0 0 14px; padding:10px 12px; background:rgba(255,61,90,0.04); border:1px solid rgba(255,61,90,0.12); border-radius:10px; font-size:10px; color:var(--text2); line-height:1.5; text-align:center; }

  .bottom-nav { position:fixed; bottom:0; left:0; right:0; z-index:200; background:rgba(14,18,32,0.97); backdrop-filter:blur(16px); border-top:1px solid var(--border); display:flex; padding-bottom:env(safe-area-inset-bottom); }
  .bnav-tab { flex:1; padding:9px 4px 8px; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; }
  .bnav-icon { font-size:18px; }
  .bnav-label { font-size:9px; color:var(--text2); font-weight:500; }
  .bnav-tab.active .bnav-label { color:var(--foreign); }

  .divider { height:8px; }
  .loading-overlay { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:999; flex-direction:column; gap:12px; }
  .loading-bar { width:200px; height:3px; background:var(--surface2); border-radius:3px; overflow:hidden; }
  .loading-fill { height:100%; background:var(--foreign); border-radius:3px; animation:loading 1.5s ease-in-out infinite; }
  @keyframes loading { 0%{width:0%;} 100%{width:100%;} }
  .loading-text { font-size:12px; color:var(--text2); font-family:'JetBrains Mono',monospace; }

  .refresh-btn { width:100%; padding:11px; background:var(--surface); border:1px solid var(--border); border-radius:10px; color:var(--foreign); font-size:12px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:12px; font-family:'Noto Sans KR',sans-serif; }

  .summary-box { background:linear-gradient(135deg,rgba(77,166,255,0.08),rgba(176,106,255,0.08)); border:1px solid rgba(77,166,255,0.2); border-radius:14px; padding:14px; margin-bottom:12px; }
  .summary-date { font-size:10px; color:var(--text2); font-family:'JetBrains Mono',monospace; margin-bottom:6px; }
  .summary-text { font-size:13px; line-height:1.7; color:var(--text3); }
  .summary-text strong { color:var(--text); }
</style>
</head>
<body>

<div class="loading-overlay" id="loading">
  <div style="font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;color:#4da6ff;">머니플로우 <em style="color:#b06aff;font-style:normal;">AI</em></div>
  <div class="loading-bar"><div class="loading-fill"></div></div>
  <div class="loading-text">데이터 로딩 중...</div>
</div>

<div class="topbar">
  <div class="logo">머니플로우 <em>AI</em></div>
  <div class="ai-status"><div class="ai-dot"></div>실시간</div>
</div>

<div class="ticker-wrap">
  <div class="ticker" id="ticker">
    <div class="ticker-item"><div class="t-label">KOSPI</div><div class="t-val up" id="t-kospi">-</div><div class="t-chg up" id="t-kospi-chg">-</div></div>
    <div class="ticker-item"><div class="t-label">KOSDAQ</div><div class="t-val up" id="t-kosdaq">-</div><div class="t-chg up" id="t-kosdaq-chg">-</div></div>
    <div class="ticker-item"><div class="t-label">외국인</div><div class="t-val" id="t-foreign">-</div><div class="t-chg up">순매수</div></div>
    <div class="ticker-item"><div class="t-label">기관</div><div class="t-val" id="t-inst">-</div><div class="t-chg down">순매도</div></div>
    <div class="ticker-item"><div class="t-label">환율</div><div class="t-val neu" id="t-usd">-</div><div class="t-chg" id="t-usd-chg">-</div></div>
    <div class="ticker-item"><div class="t-label">업데이트</div><div class="t-val neu" id="t-date" style="font-size:10px">-</div></div>
  </div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('flow',this)"><span class="tab-icon">💰</span>자금흐름</div>
  <div class="tab" onclick="switchTab('sector',this)"><span class="tab-icon">🗂️</span>섹터</div>
  <div class="tab" onclick="switchTab('my',this)"><span class="tab-icon">⭐</span>내종목</div>
  <div class="tab" onclick="switchTab('etf',this)"><span class="tab-icon">📦</span>ETF</div>
  <div class="tab" onclick="switchTab('trend',this)"><span class="tab-icon">📈</span>5일</div>
</div>

<!-- 자금흐름 -->
<div class="page active" id="page-flow">
  <div class="divider"></div>
  <div class="summary-box" id="flow-summary">
    <div class="summary-date" id="flow-date">-</div>
    <div class="summary-text" id="flow-text">데이터 로딩 중...</div>
  </div>
  <div class="sec-header"><div class="sec-title">외국인/기관 수급</div></div>
  <div id="flow-cards"></div>
  <div class="sec-header"><div class="sec-title">순매수 TOP 5</div></div>
  <div class="toggle">
    <div class="toggle-btn active" onclick="switchFlow('foreign',this)">🌍 외국인</div>
    <div class="toggle-btn" onclick="switchFlow('inst',this)">🏦 기관</div>
  </div>
  <div id="flow-top-list"></div>
  <div class="disclaimer">⚠️ 투자 손실 책임은 본인에게 있습니다</div>
</div>

<!-- 섹터 -->
<div class="page" id="page-sector">
  <div class="divider"></div>
  <div class="sec-header"><div class="sec-title">업종별 등락</div><div class="sec-date" id="sector-date">-</div></div>
  <div class="sector-grid" id="sector-grid"></div>
  <div class="sec-header"><div class="sec-title">순환매 신호</div></div>
  <div id="rotation-signal"></div>
  <div class="disclaimer">⚠️ 투자 손실 책임은 본인에게 있습니다</div>
</div>

<!-- 내종목 -->
<div class="page" id="page-my">
  <div class="divider"></div>
  <div class="toggle">
    <div class="toggle-btn active" onclick="switchMyTab('kr',this)">🇰🇷 국내</div>
    <div class="toggle-btn" onclick="switchMyTab('us',this)">🇺🇸 해외</div>
  </div>
  <div id="my-stocks"></div>
</div>

<!-- ETF -->
<div class="page" id="page-etf">
  <div class="divider"></div>
  <div class="sec-header"><div class="sec-title">보유 ETF</div></div>
  <div id="etf-list"></div>
</div>

<!-- 5일 추이 -->
<div class="page" id="page-trend">
  <div class="divider"></div>
  <div class="sec-header"><div class="sec-title">5일 수급 추이</div></div>
  <div id="trend-list"></div>
  <div class="disclaimer">⚠️ 투자 손실 책임은 본인에게 있습니다</div>
</div>

<script>

let appData = {

// ── data.json 로드 ──────────────────────────────────────
async function loadData() {

    appData = {...appData, ...data};

    appData.inst_total = -5184;
    appData.foreign_top = [

      {name:'삼성전자', netBuy:'+3,204억', change:'+10.11%'},
      {name:'LG에너지솔루션', netBuy:'+1,892억', change:'+5.43%'},
      {name:'HD현대중공업', netBuy:'+987억', change:'+11.28%'},
      {name:'POSCO홀딩스', netBuy:'+845억', change:'+3.21%'},
    ];
    appData.inst_top = [
      {name:'KODEX레버리지', netBuy:'+2,341억', change:'+12.3%'},
      {name:'삼성바이오로직스', netBuy:'+1,102억', change:'+3.45%'},
      {name:'카카오', netBuy:'+892억', change:'+4.21%'},
      {name:'HD현대중공업', netBuy:'+781억', change:'+11.28%'},
      {name:'셀트리온', netBuy:'+654억', change:'+2.11%'},
    ];
    appData.sectors = [
      {name:'반도체', change:'+8.2'}, {name:'조선', change:'+5.1'},
      {name:'방산', change:'+3.8'}, {name:'전력', change:'+2.9'},
      {name:'금융', change:'+1.2'}, {name:'바이오', change:'-0.8'},
      {name:'2차전지', change:'-1.5'}, {name:'뷰티', change:'+0.4'},
      {name:'로봇', change:'+1.1'},
    ];
    appData.history = [
      {date:'4/30', foreign:1240, inst:320},
      {date:'5/1', foreign:-320, inst:1100},
      {date:'5/2', foreign:890, inst:-890},
      {date:'5/4', foreign:2100, inst:-2400},
      {date:'5/7', foreign:2760, inst:-5184},
    ];
    // 샘플 주가
    MY_STOCKS_KR.forEach(s => {
      appData.stocks_kr[s.code] = {price:'-', change:'0.00', isUp:true};
    });
    MY_ETF_KR.forEach(s => {
      appData.stocks_kr[s.code] = {price:'-', change:'0.00', isUp:true};
    });
    MY_STOCKS_US.forEach(s => {
      appData.stocks_us[s.ticker] = {price:'-', change:'0.00', isUp:true};
    });
  }
}

// ── 렌더 함수들 ──────────────────────────────────────────
function renderTicker() {
  const d = appData;
  document.getElementById('t-kospi').textContent = d.kospi.value;
  document.getElementById('t-kospi').className = 't-val ' + (d.kospi.isUp?'up':'down');
  document.getElementById('t-kospi-chg').textContent = d.kospi.change;
  document.getElementById('t-kosdaq').textContent = d.kosdaq.value;
  document.getElementById('t-kosdaq-chg').textContent = d.kosdaq.change;
  document.getElementById('t-foreign').textContent = (d.foreign_total>0?'+':'')+d.foreign_total.toLocaleString()+'억';
  document.getElementById('t-foreign').className = 't-val '+(d.foreign_total>0?'up':'down');
  document.getElementById('t-inst').textContent = (d.inst_total>0?'+':'')+d.inst_total.toLocaleString()+'억';
  document.getElementById('t-inst').className = 't-val '+(d.inst_total>0?'up':'down');
  document.getElementById('t-usd').textContent = d.usd.value;
  document.getElementById('t-date').textContent = d.date;
}

function renderFlow() {
  const d = appData;
  // 요약 텍스트
  const fUp = d.foreign_total > 0;
  const iUp = d.inst_total > 0;
  document.getElementById('flow-date').textContent = d.date + ' 자금흐름 요약';
  document.getElementById('flow-text').innerHTML = `
    외국인 <strong style="color:${fUp?'var(--up)':'var(--down)'}">${fUp?'+':''}${d.foreign_total.toLocaleString()}억</strong> ${fUp?'순매수':'순매도'},
    기관 <strong style="color:${iUp?'var(--up)':'var(--down)'}">${iUp?'+':''}${d.inst_total.toLocaleString()}억</strong> ${iUp?'순매수':'순매도'}<br>
    외국인 1위 <strong>${d.foreign_top[0]?.name||'-'}</strong>, 기관 1위 <strong>${d.inst_top[0]?.name||'-'}</strong>
  `;

  // 수급 바
  const maxAbs = Math.max(Math.abs(d.foreign_total), Math.abs(d.inst_total), 1000);
  document.getElementById('flow-cards').innerHTML = `
    <div class="flow-summary">
      <div class="flow-bars">
        <div class="flow-row">
          <div class="flow-label" style="color:var(--foreign)">외국인</div>
          <div class="flow-track"><div class="${d.foreign_total>=0?'flow-fill-pos':'flow-fill-neg'}" style="width:${Math.abs(d.foreign_total)/maxAbs*100}%"></div></div>
          <div class="flow-val" style="color:${d.foreign_total>=0?'var(--up)':'var(--down)'}">${d.foreign_total>=0?'+':''}${d.foreign_total.toLocaleString()}억</div>
        </div>
        <div class="flow-row">
          <div class="flow-label" style="color:var(--inst)">기관</div>
          <div class="flow-track"><div class="${d.inst_total>=0?'flow-fill-pos':'flow-fill-neg'}" style="width:${Math.abs(d.inst_total)/maxAbs*100}%"></div></div>
          <div class="flow-val" style="color:${d.inst_total>=0?'var(--up)':'var(--down)'}">${d.inst_total>=0?'+':''}${d.inst_total.toLocaleString()}억</div>
        </div>
      </div>
    </div>
  `;
  renderFlowTop('foreign');
}

function renderFlowTop(type) {
  const list = type==='foreign' ? appData.foreign_top : appData.inst_top;
  document.getElementById('flow-top-list').innerHTML = list.map((s,i) => {
    const isUp = !String(s.change).startsWith('-');
    return `
      <div class="stock-card" style="animation-delay:${i*0.05}s">
        <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:${i===0?'#f5c842':i===1?'#aab0be':i===2?'#cd7f32':'var(--text2)'};width:18px;text-align:center;flex-shrink:0">#${i+1}</div>
        <div class="stock-left"><div class="stock-name">${s.name}</div></div>
        <div class="stock-right">
          <div class="stock-price" style="color:${type==='foreign'?'var(--foreign)':'var(--inst)'}">${s.netBuy}</div>
          <div class="stock-chg" style="color:${isUp?'var(--up)':'var(--down)'}">${s.change}</div>
        </div>
      </div>`;
  }).join('');
}

function renderSectors() {
  document.getElementById('sector-date').textContent = appData.date;
  document.getElementById('sector-grid').innerHTML = appData.sectors.map((s,i) => {
    const pct = parseFloat(s.change)||0;
    const cls = pct > 1 ? 'hot-up' : pct < -1 ? 'hot-down' : '';
    return `
      <div class="sector-cell ${cls}" style="animation-delay:${i*0.04}s">
        <div class="sector-name">${s.name}</div>
        <div class="sector-pct" style="color:${pct>=0?'var(--up)':'var(--down)'}">${pct>=0?'+':''}${pct.toFixed(1)}%</div>
      </div>`;
  }).join('');

  // 순환매 신호
  const top = [...appData.sectors].sort((a,b)=>parseFloat(b.change)-parseFloat(a.change));
  const bot = [...appData.sectors].sort((a,b)=>parseFloat(a.change)-parseFloat(b.change));
  document.getElementById('rotation-signal').innerHTML = `
    <div class="flow-card">
      <div class="flow-card-top">
        <div class="flow-card-name">🔥 오늘 강한 섹터</div>
      </div>
      ${top.slice(0,3).map(s=>`<div style="font-size:12px;color:var(--up);margin-bottom:4px">▲ ${s.name} <span style="font-family:'JetBrains Mono',monospace">+${parseFloat(s.change).toFixed(1)}%</span></div>`).join('')}
    </div>
    <div class="flow-card">
      <div class="flow-card-top">
        <div class="flow-card-name">❄️ 오늘 약한 섹터</div>
      </div>
      ${bot.slice(0,3).map(s=>`<div style="font-size:12px;color:var(--down);margin-bottom:4px">▼ ${s.name} <span style="font-family:'JetBrains Mono',monospace">${parseFloat(s.change).toFixed(1)}%</span></div>`).join('')}
    </div>
  `;
}

function renderMyStocks(type) {
  const list = type === 'kr' ? MY_STOCKS_KR : MY_STOCKS_US;
  const stockData = type === 'kr' ? appData.stocks_kr : appData.stocks_us;
  const key = type === 'kr' ? 'code' : 'ticker';

  document.getElementById('my-stocks').innerHTML = list.map((s,i) => {
    const d = stockData[s[key]] || {price:'-', change:'0.00', isUp:true};
    const isUp = d.isUp;
    const chgStr = d.change ? (isUp?'+':'')+d.change+'%' : '-';
    return `
      <div class="stock-card" style="animation-delay:${i*0.04}s">
        <div class="stock-left">
          <div class="stock-name">${s.name}</div>
          <span class="stock-tag">${s.sector}</span>
        </div>
        <div class="stock-right">
          <div class="stock-price" style="color:${isUp?'var(--up)':'var(--down)'}">${d.price}</div>
          <div class="stock-chg" style="color:${isUp?'var(--up)':'var(--down)'}">${chgStr}</div>
        </div>
      </div>`;
  }).join('');
}

function renderETF() {
  // 그룹별 정리
  const groups = {};
  MY_ETF_KR.forEach(s => {
    if(!groups[s.sector]) groups[s.sector] = [];
    const d = appData.stocks_kr[s.code] || {price:'-', change:'0.00', isUp:true};
    groups[s.sector].push({...s, d});
  });

  document.getElementById('etf-list').innerHTML = Object.entries(groups).map(([sector, etfs]) => `
    <div class="stock-group">
      <div class="stock-group-title">${sector}</div>
      <div class="stock-list">
        ${etfs.map((s,i) => {
          const isUp = s.d.isUp;
          const chgStr = s.d.change ? (isUp?'+':'')+s.d.change+'%' : '-';
          return `
            <div class="stock-card" style="animation-delay:${i*0.04}s">
              <div class="stock-left"><div class="stock-name" style="font-size:12px">${s.name}</div></div>
              <div class="stock-right">
                <div class="stock-price" style="color:${isUp?'var(--up)':'var(--down)'}">${s.d.price}</div>
                <div class="stock-chg" style="color:${isUp?'var(--up)':'var(--down)'}">${chgStr}</div>
              </div>
            </div>`;
        }).join('')}
      </div>
    </div>
  `).join('');
}

function renderTrend() {
  const d = appData.history;
  if(!d || d.length === 0) return;
  const trends = [
    {name:'외국인 순매수', color:'#4da6ff', vals:d.map(h=>h.foreign||0), days:d.map(h=>h.date)},
    {name:'기관 순매수', color:'#ffb340', vals:d.map(h=>h.inst||0), days:d.map(h=>h.date)},
  ];
  document.getElementById('trend-list').innerHTML = trends.map((t,ti) => {
    const maxAbs = Math.max(...t.vals.map(v=>Math.abs(v)), 1);
    const bars = t.vals.map((v,i) => {
      const h = Math.abs(v)/maxAbs*38;
      return `<div class="mbar-wrap"><div class="mbar" style="height:${h}px;background:${v>=0?t.color:'var(--down)'};opacity:${0.4+i*0.15}"></div><div class="mday">${t.days[i]}</div></div>`;
    }).join('');
    const last = t.vals[t.vals.length-1];
    return `
      <div class="trend-card" style="animation-delay:${ti*0.08}s">
        <div class="trend-top">
          <div class="trend-name">${t.name}</div>
          <div class="trend-val" style="color:${last>=0?'var(--up)':'var(--down)'}">${last>=0?'+':''}${last.toLocaleString()}억</div>
        </div>
        <div class="mini-bars">${bars}</div>
      </div>`;
  }).join('');
}

// ── 네비게이션 ──────────────────────────────────────────
function switchTab(page, el) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
  el.classList.add('active');
  window.scrollTo(0,0);
}

let currentFlow = 'foreign';
function switchFlow(type, el) {
  currentFlow = type;
  document.querySelectorAll('.toggle-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  renderFlowTop(type);
}

let currentMyTab = 'kr';
function switchMyTab(type, el) {
  currentMyTab = type;
  document.querySelectorAll('.toggle-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  renderMyStocks(type);
}

// ── 초기화 ──────────────────────────────────────────────
async function init() {
  await loadData();
  renderTicker();
  renderFlow();
  renderSectors();
  renderMyStocks('kr');
  renderETF();
  renderTrend();
  document.getElementById('loading').style.display='none';
}
init();
</script>
</body>
</html>
